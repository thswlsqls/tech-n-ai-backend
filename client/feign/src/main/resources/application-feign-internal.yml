feign:
  client:
    config:
      contest-internal-api:
        url: http://localhost:8081  # api-contest 서버 URL
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: full
      news-internal-api:
        url: http://localhost:8082  # api-news 서버 URL
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: full
      emerging-tech-internal-api:
        url: http://localhost:8082  # api-emerging-tech 서버 URL
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: full
      agent-api:
        url: http://localhost:8086  # api-agent 서버 URL
        connectTimeout: 5000
        readTimeout: 60000
        loggerLevel: full

# 내부 API 키 설정
internal-api:
  contest:
    api-key: ${INTERNAL_API_CONTEST_KEY:default-contest-api-key}
  news:
    api-key: ${INTERNAL_API_NEWS_KEY:default-news-api-key}
  emerging-tech:
    # 서버(api-emerging-tech)와 같은 변수를 먼저 읽고, 예전 이름도 계속 받는다
    api-key: ${EMERGING_TECH_INTERNAL_API_KEY:${INTERNAL_API_EMERGING_TECH_KEY:default-emerging-tech-api-key}}
