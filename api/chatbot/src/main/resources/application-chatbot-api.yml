module:
  aurora:
    schema: chatbot
  mysql:
    port: 3310

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:}
      model-name: gpt-4o-mini  # 기본 모델 (비용 최적화)
      temperature: 0.7
      max-tokens: 2000
      timeout: 60s
    embedding-model:
      api-key: ${OPENAI_API_KEY:}  # LLM과 동일한 API Key 사용 가능
      model-name: text-embedding-3-small  # 기본 모델 (비용 최적화: $0.02 per 1M tokens)
      dimensions: 1536  # 기본 차원 (필요시 dimensions 파라미터로 조정 가능)
      timeout: 30s

chatbot:
  # RAG 설정 (OpenAI GPT-4o-mini 기준: 128K 컨텍스트)
  rag:
    max-search-results: 5  # 검색 결과 최대 개수
    min-similarity-score: 0.7  # 최소 유사도 점수
    max-context-tokens: 3000  # 컨텍스트 최대 토큰 수
    recency-months: 6  # 최신성 키워드 감지 시 검색할 기간 (개월)

    # 지식 그래프 검색 설정 (기본 꺼둠 — 평가 잡에서만 켠다)
    graph:
      enabled: false  # 활성화 여부
      max-results: 10  # 그래프가 돌려줄 문서 최대 개수
      max-seeds: 20  # 질문이 맞춘 시드 노드 최대 개수
      max-edges-per-seed: 20  # 시드 하나당 훑을 엣지 최대 개수
      max-time-ms: 2000  # 그래프 조회 실행 시간 상한 (밀리초)

    # 근거가 약할 때 조건을 완화해 다시 찾기 (기본 꺼둠 — 평가 잡에서만 켠다)
    augment:
      enabled: false  # 활성화 여부
      max-attempts: 2  # 재검색 최대 횟수
      min-vector-score: 0.72  # 후보 최고 vectorScore가 이 값 미만이면 근거가 약하다고 본다
      relaxed-min-score: 0.5  # 2단계에서 낮출 유사도 문턱

  # Re-Ranking 설정 (Cohere)
  reranking:
    enabled: false  # 활성화 여부 (API Key 설정 시 true로 변경)
    api-key: ${COHERE_API_KEY:}
    model-name: rerank-multilingual-v3.0  # 다국어 지원
    min-score: 0.3  # 최소 점수 임계값

  # Web 검색 설정 (Google Custom Search API)
  web-search:
    enabled: false  # 활성화 여부 (API Key 설정 시 true로 변경)
    api-key: ${GOOGLE_SEARCH_API_KEY:}
    search-engine-id: ${GOOGLE_SEARCH_ENGINE_ID:}
    max-results: 5  # 기본 검색 결과 수
  
  # 입력 전처리 설정
  input:
    max-length: 500  # 최대 입력 길이
    min-length: 1  # 최소 입력 길이
  
  # 토큰 제어 설정 (OpenAI GPT-4o-mini 기준: 128K 컨텍스트)
  token:
    max-input-tokens: 4000  # 최대 입력 토큰
    max-output-tokens: 2000  # 최대 출력 토큰
    warning-threshold: 0.8  # 경고 임계값 (80%)
  
  # 캐싱 설정
  cache:
    enabled: true
    ttl-hours: 1  # TTL (시간 단위, 기본값: 1시간 = 3600초)
    max-size: 1000  # 최대 캐시 크기
  
  # 세션 생명주기 설정
  session:
    inactive-threshold-minutes: 30  # 비활성화 임계값 (마지막 메시지 후 N분 경과 시 비활성)
    expiration-days: 90  # 만료 기간 (마지막 메시지 후 N일 경과 시 만료)
    batch-enabled: true  # 배치 작업 활성화 여부 (세션 만료 처리용)
  
  # ChatMemory 설정 (메시지 개수 기준으로 최근 대화만 남기는 창)
  chat-memory:
    max-messages: 10  # 창에 남길 최대 메시지 수 (이력 조회가 최근 50건까지라 50을 넘겨도 더 오지 않는다)
