# ============================================================================
# LangChain4j OSS Contribution Pipeline v2 — Project Configuration
# ============================================================================
# 모든 에이전트·오케스트레이터·tmux 스크립트가 이 파일을 단일 진실 소스로 사용한다.
# 다른 프로젝트로 이식할 때는 이 파일만 교체하면 된다.
# v1 대비 변경점: 출력이 run 단위(yyyyMMddHHmmss) 3폴더 + 단일 _learnings.md 피드백 루프.

project:
  name: langchain4j
  upstream: langchain4j/langchain4j
  upstream_url: https://github.com/langchain4j/langchain4j.git
  fork: thswlsqls/langchain4j
  default_branch: main
  java_version: 17

paths:
  main_root: /Users/m1/workspace/langchain4j
  output_dir: /Users/m1/workspace/langchain4j/z-ebson/v2/pipeline/output
  templates_dir: /Users/m1/workspace/langchain4j/z-ebson/v2/pipeline/output/templates
  learnings_file: /Users/m1/workspace/langchain4j/z-ebson/v2/pipeline/output/_learnings.md
  worktree_dir: /Users/m1/workspace/langchain4j-worktrees
  plugin_dir: /Users/m1/workspace/langchain4j/z-ebson/v2/pipeline/oss-contrib-agent
  config_file: /Users/m1/workspace/langchain4j/z-ebson/v2/pipeline/contrib-config.yml
  # 권위 출처: 공식 기여 규칙(우선) + 파이프라인 도입 전 수동 작업물(참고/중복제외)
  contributing_md: /Users/m1/workspace/langchain4j/CONTRIBUTING.md
  curated_guide: /Users/m1/workspace/langchain4j/z-ebson/CONTRIBUTION_GUIDE.md

# {module}/{modules}는 변경된 모듈 디렉토리명으로 치환 (예: langchain4j-open-ai)
build:
  format_apply: "./mvnw -T12C -Pspotless spotless:apply -pl {modules}"
  format_check: "./mvnw -T12C -Pspotless spotless:check -pl {modules}"
  unit_test: "./mvnw -pl {module} -am clean test"
  core_regression: "./mvnw -pl langchain4j-core,langchain4j clean test"
  docs_only: skip          # docs/ 만 변경 시 빌드 생략
  integration_tests: skip  # *IT는 API 키 필요(@EnabledIfEnvironmentVariable) — 로컬 실행 금지, 기록만

# 불변 규칙의 유일한 권위 출처는 CONTRIBUTING.md. 아래는 그 발췌(편의용 캐시).
conventions:
  # PR 제목: Conventional Commits 타입 접두사 + 명령형 + 마침표 없음. 타입은 변경 종류(=브랜치 type)와 일치.
  # 근거: 레포 머지 PR 다수가 fix:/feat:/docs:/chore:/refactor: 접두사 사용(접두사 없는 것도 있으나, 본인 머지 PR은 전부 접두사 사용 → 일관성 위해 강제). CONTRIBUTING.md에 명문 규칙은 없음(empirical 컨벤션).
  pr_title_style: conventional-prefix    # 예: "fix: <명령형 설명>" / "feat:" / "docs:" / "refactor:" / "test:". 모듈 접두사 강제 없음, 마침표 없음
  pr_title_types: { bug-fix: "fix:", feature: "feat:", docs: "docs:", refactor: "refactor:", test: "test:", chore: "chore:" }
  # 이슈 제목: 레포 이슈 템플릿이 강제하는 접두사(권위 출처 = .github/ISSUE_TEMPLATE/*). 버그=[BUG], 기능=[FEATURE].
  issue_title_style: template-prefix     # 버그리포트 → "[BUG] <설명>", 기능요청 → "[FEATURE] <설명>"
  pr_draft_first: true                  # PR은 반드시 Draft로 먼저 (사람이 제출)
  tests_required: true                  # "no tests, no review!" — 코드(동작) 변경에 테스트 필수. 단 단순 오타 수정(change_type.typo_fix)은 검증할 동작이 없어 예외(억지 테스트 금지).
  breaking_changes: forbidden           # 제거 대신 @Deprecated, Java 17 호환
  new_dependencies: avoid               # test scope만 허용
  new_integrations: community-repo-only # 신규 모델/스토어 통합은 langchain4j-community로
  docs_in_initial_pr: false             # 문서/예제는 PR 승인 후 추가
  issue_required_for: [bug-fix, feature]
  small_focused_pr: true                # 리팩터링과 변경 혼합 금지, 기존 코드 재포맷 금지

pipeline:
  # 기본은 1실행 = 1기여(머지 확률 > 양). 단 strong_candidate 기준을 모두 충족한 후보가
  # 2건 이상이면 1건만 고르지 않고 전부 구현한다(아래 strong_candidate.implement_all_when_multiple).
  max_contributions_per_run: 1
  score_threshold: 18             # 25점 만점 중 18점 미만 추천 금지
  run_folder_format: yyyyMMddHHmmss   # output/<yyyyMMddHHmmss>/{candidates,issues,prs}
  series_probe_first: true        # 동일 패턴: 1건 제출 → 머지 확인 후 확산
  # "유력 후보"(strong candidate) 정의 — 세 기준을 모두 충족해야 강한 후보다.
  strong_candidate:
    min_score: 22                 # ① 25점 만점 중 22점 이상(finder 점수)
    verdict: GO                   # ② candidate-reviewer 판정이 GO
    high_merge_likelihood: true   # ③ 머지 가능성 높음 — reviewer GO가 이를 보증(별도 확률값은 없음)
    implement_all_when_multiple: true  # 강한 후보가 2건 이상이면 전부 구현(1건만 고르지 않음)
  # 강한 후보 기준을 일부만 충족한 near-miss 후보(예: 22점 미만이지만 GO, 또는 22점인데 CAUTION)는
  # 구현하지 않더라도 P5 handoff에서 사용자에게 리마인드한다(조용히 버리지 않는다).
  remind_near_miss: true

# 산출물 정책 — OSS 기여에 "꼭 필요한" md만 만든다(불필요 파일/폴더 생성 금지).
# 분기 기준은 change_type(아래). 단순 오타 수정만 PR-only, 그 외 후보는 이슈 초안을 PR보다 먼저 만든다.
# 근거: CONTRIBUTING.md:6 "버그픽스·기능은 아직 이슈에 없으면 먼저 이슈를 연다" → 이슈 선행이 권위 규칙.
output_policy:
  candidate_file: always             # 내부 분석·중복방지(P1 grep) 입력 — 항상 생성
  pr_draft: always                   # 실제 제출 artifact — 항상 생성
  issue_draft: required-unless-typo  # 단순 오타 수정이 아니면 작성. issues/ 폴더도 그때만 mkdir.
  issue_before_pr: true              # 이슈 초안을 PR 초안보다 "먼저" 작성한다.
  issue_required_when:
    - not-typo-fix                   # 단순 오타 수정(change_type.typo_fix)이 아닌 모든 후보(버그픽스·기능 등)
    - no-existing-issue              # gh로 동일 주제 open 이슈가 없을 때만 신규 초안. 있으면 PR에서 참조만.

# 변경 유형 분류 — 산출물(이슈)·테스트 정책의 단일 분기 기준. finder가 태깅 → reviewer 확인 → contributor 분기.
change_type:
  # 단순 오타 수정: 의미·동작은 그대로 두고 철자·표현만 고치는 변경.
  # 대상: 주석·Javadoc·*.md 문서·비동작 문자열(로그/예외 메시지 표현)의 철자·표현 교정, dead {@link}.
  # 런타임 동작(분기·계산·반환값·출력 계약)이 바뀌면 typo-fix가 아니다(그건 wrong-output 등 비-오타).
  typo_fix:
    no_test: true                    # 검증할 동작이 없다 — 오타 수정 PR에 테스트를 끼워넣지 않는다(억지 테스트 금지).
    pr_only: true                    # 이슈 초안을 만들지 않는다(PR-only).
  # 그 외 전부 비-오타(non-typo): 동작/구조/계약 변경. 이슈 초안을 PR보다 먼저 작성(output_policy 참조).

# 후보 품질 선호 — NPE/null-guard 단일 패턴 과편향(monoculture) 교정.
# 과거 run이 거의 매번 "internal-inconsistency-parity null-guard"로 수렴했다(_learnings.md §1·§2):
# GO는 잘 받지만 트리거가 악성·비정상 입력 의존이라 real-world 영향이 약하고(자인: 영향 3/5),
# 메인테이너에게 방어용 노이즈로 비칠 수 있다. finder/reviewer/orchestrator는 아래 선호를 강제한다.
candidate_quality:
  npe_guard_is_fallback: true          # null/blank 입력 가드 "단독" 후보는 차선책(fallback)으로만
  # 먼저 소진할 고가치 후보 클래스 — 이쪽이 임계를 넘기면 NPE-guard보다 우선 선택한다.
  prefer_classes:
    - wrong-output     # 정상 입력에 잘못된 결과: 인자 스왑, off-by-one, 잘못된 URL/메타데이터 구성
    - logic-error      # 분기/계산 오류, 무한루프, 리소스 누수, 동시성 결함
    - github-backed    # 재현되는 open issue 또는 머지 PR의 incomplete-fix가 뒷받침
    - dead-ref-docs    # 복붙 시 컴파일 에러(dead-enum)·dead-link·broken-anchor
    - api-contract     # Javadoc/문서와 실제 동작 불일치 등 계약 위반
  # NPE-guard 후보를 "최종 선택"하려면 finder가 아래 둘을 후보 파일에 명시 입증해야 한다.
  npe_guard_requires:
    - realistic-trigger  # null/blank가 악성·테스트 입력이 아닌 정상 호출경로에서 도달함을 코드로 증명
    - exhausted-higher   # 같은 스코프에서 prefer_classes를 실제 탐색했고 없었음을 한 줄로 기록

# 이슈/PR 초안 분량 가드 — 장황함 방지. contributor가 Step 6/7에서 self-check로 강제.
doc_limits:
  issue_max_words: 200    # 본문 단어수 상한 (끝의 gh 제출 코드블록 제외)
  pr_max_words: 220       # 본문 단어수 상한 (General checklist·staleness·제출 코드블록 제외)
  rules:
    - one-fact-per-line     # 한 줄 = 한 사실. 같은 사실을 여러 섹션에 반복 금지.
    - no-template-hints     # 템플릿의 <!-- 안내 --> 주석은 최종본에서 삭제.
    - single-code-snippet   # 코드블록은 핵심(수정 형태) 1개만. before/after 중복 금지.
    - factual-imperative    # 마케팅·완충·중언부언 금지. 사실·명령형으로.
  self_check: "작성 후 wc -w로 본문 단어수 측정 → 예산 초과 시 중복 사실부터 제거하고 재측정"

# closed-loop 학습 — P0에서 자동 상태 폴링에 사용. 제출은 사람이 하므로 PR 번호는 §0에 사람이 적는다.
feedback:
  poll_pending_on_setup: true   # P0가 _learnings.md "§0 제출 추적"의 pending PR을 gh로 조회해 결과 반영
  poll_command: 'gh pr view {pr} -R langchain4j/langchain4j --json state,mergedAt,closedAt,reviewDecision'

# 고감도 영역: candidate-reviewer가 CAUTION 이상으로 취급
sensitive_areas:
  - langchain4j-core/src/main/java/dev/langchain4j/model/chat   # ChatModel API 표면
  - langchain4j/src/main/java/dev/langchain4j/service           # AiServices 핵심
  - langchain4j-bom                                             # 의존성 관리
  - pom.xml                                                     # 루트 빌드 설정
