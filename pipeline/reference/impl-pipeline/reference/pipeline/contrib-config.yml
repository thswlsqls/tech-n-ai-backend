# ============================================================================
# Apache Iceberg OSS Contribution Pipeline — Project Configuration
# ============================================================================
# 모든 에이전트·오케스트레이터·tmux 스크립트가 이 파일을 단일 진실 소스로 사용한다.
# 다른 프로젝트로 이식할 때는 이 파일과 에이전트 프롬프트의 프로젝트-고유 규칙만 교체한다.
#
# 계보: langchain4j v2 → jenkins v3 → opentelemetry-java v4 → apache-iceberg.
#   [유지] config 단일화 / 휴먼 게이트 / worktree 격리 / 3에이전트 /
#          머지확률>양 / closed-loop _learnings.md / monoculture 교정 / probe-first
#   [Iceberg 적응#1] 빌드는 Gradle, 모듈 path 스코프(`:iceberg-core:check`). 단, OTel과 달리
#                    Gradle 프로젝트 path(`:iceberg-core`)와 디렉터리(`core/`)가 다르게 매핑된다.
#   [Iceberg 적응#2] API 호환성은 revapi(빌드-실패 게이트). OTel의 apidiff처럼 diff 파일을
#                    커밋하지 않는다 — 검사만 통과하면 된다. REVAPI 대상은 published 6개 모듈뿐.
#   [Iceberg 적응#3] PR 제목 규칙이 `Module: Description`(예 "Core: Fix ...") — OTel의 명령형 문장과 다르다.
#   [Iceberg 적응#4] 직렬화는 Jackson 애너테이션 금지 → 커스텀 XxxParser.toJson/fromJson(kebab-case 키).
#                    null over Optional, CloseableIterable over Stream, package-private 기본.
#   [Iceberg 적응#5] spec 게이트 = format/ 와 open-api/rest-catalog* 변경은 PMC 투표(찬성 3표, lazy consensus 없음)
#                    대상 → 자동 기여 범위 밖(gated). 그 외는 일반 PR(exempt).
#   [Iceberg 적응#6] AGENTS.md는 AI 생성/보조 PR에 disclosure 블록을 권고하나, 사용자 결정으로 PR/이슈 본문에는 넣지 않는다(커밋 Generated-by 토큰만 유지).

project:
  name: iceberg
  upstream: apache/iceberg
  upstream_url: https://github.com/apache/iceberg.git
  fork: thswlsqls/iceberg
  default_branch: main
  java_version: "17-or-21"        # 빌드는 JDK 17 또는 21 필수. build.gradle이 다른 JDK면 빌드 실패시킴.
  release_model: periodic-minor   # 정기 minor 릴리스. 공개 API 추가는 머지 전 24h 대기(추가 피드백 보장).

paths:
  # 이 파이프라인은 자기가 사는 repo(iceberg)를 대상으로 동작한다.
  main_root: /Users/m1/workspace/iceberg
  output_dir: /Users/m1/workspace/iceberg/z_ebson/pipeline/output
  templates_dir: /Users/m1/workspace/iceberg/z_ebson/pipeline/output/templates
  learnings_file: /Users/m1/workspace/iceberg/z_ebson/pipeline/output/_learnings.md
  worktree_dir: /Users/m1/workspace/iceberg-worktrees
  plugin_dir: /Users/m1/workspace/iceberg/z_ebson/pipeline/oss-contrib-agent
  config_file: /Users/m1/workspace/iceberg/z_ebson/pipeline/contrib-config.yml
  # 권위 출처: 공식 기여 규칙(1순위) + 리포 코딩 규약(2순위) + 큐레이트 가이드(참고)
  contributing_md: /Users/m1/workspace/iceberg/CONTRIBUTING.md   # 23줄 스텁 → iceberg.apache.org/contribute/ 로 연결
  agents_md: /Users/m1/workspace/iceberg/AGENTS.md               # 실질 코딩 규약의 권위(58k+ 리뷰 코멘트 정리)
  claude_md: /Users/m1/workspace/iceberg/CLAUDE.md               # 빌드 커맨드·모듈 경계 요약
  contribute_url: https://iceberg.apache.org/contribute/         # 공식 기여 가이드 본문(라이브)
  curated_guide: /Users/m1/workspace/iceberg/z_ebson/apache-iceberg-기여-가이드.md  # 한글 기여 가이드(검증 정리물)
  # Iceberg는 .github에 PR 템플릿이 없다(루트 CONTRIBUTING.md는 스텁) — 실제 PR 관행이 권위 출처:
  pr_examples: https://github.com/apache/iceberg/pulls
  # 파이프라인 자기 보호: 이 트리는 프로젝트 코드가 아니라 인프라다. contributor는 절대 수정 금지.
  pipeline_self: /Users/m1/workspace/iceberg/z_ebson

# Apache Iceberg는 Gradle + wrapper(./gradlew) + Java 17/21을 쓴다.
# {module} = Gradle 프로젝트 path(선행 콜론 포함). 예: :iceberg-core, :iceberg-api, :iceberg-data,
#            :iceberg-parquet, :iceberg-spark:spark-4.1_2.13, :iceberg-flink:flink-1.20.
# ⚠️ 프로젝트 path는 settings.gradle의 project(':core').name='iceberg-core' 재명명 결과다.
#    디렉터리는 path와 다르다: :iceberg-core→core/, :iceberg-spark:spark-4.1_2.13→spark/v4.1/.
#    디렉터리가 필요하면 settings.gradle 또는 `./gradlew :iceberg-core:properties`로 확인한다(추측 금지).
build:
  # 포맷 자동 수정 — 커밋 전 필수. spotless가 googleJavaFormat(1.22.0)+removeUnusedImports+라이선스헤더를 적용.
  format_apply: "./gradlew {module}:spotlessApply"
  format_check: "./gradlew {module}:spotlessCheck"
  # 빠른 반복 검증(유닛 테스트만). 단일 테스트는 --tests "<FQCN>" 또는 "<FQCN>.<method>".
  unit_test: "./gradlew {module}:test"
  # 모듈 스코프 권위 게이트 — test + spotlessCheck + checkstyle + errorProne(palantir baseline) 포함.
  # 제출 전 최소 1회 이 커맨드를 통과해야 한다.
  verify: "./gradlew {module}:check"
  # 공개 API 호환성 검사(revapi) — REVAPI 대상 모듈에서만 의미. 호환 깨면 빌드 실패(deprecation 사이클 필요).
  # 대상: iceberg-api, iceberg-core, iceberg-parquet, iceberg-orc, iceberg-common, iceberg-data.
  # OTel의 apidiff와 달리 커밋할 diff 파일을 만들지 않는다 — 검사 통과가 전부.
  revapi: "./gradlew {module}:revapi"
  # 전체 빌드(테스트 제외) — 모듈 스코프가 더 빠르므로 보통 불필요. 광범위 변경 점검용.
  full_build: "./gradlew build -x test -x integrationTest"
  docs_only: skip               # *.md / Javadoc만 변경 시 Gradle 생략(단 Javadoc은 spotlessCheck 권장)
  integration_tests: skip       # integrationTest / Docker(testcontainers) 의존 — 로컬 실행 금지, 기록만

# 불변 규칙의 유일한 권위 출처는 CONTRIBUTING.md(→contribute 사이트) + AGENTS.md + CLAUDE.md.
# 아래는 그 발췌(편의용 캐시). ⚠️ OTel v4에서 정반대였던 항목 주의(deprecation/@since/PR 제목).
conventions:
  pr_title_style: module-prefix          # ⚠️OTel와 다름: "Module: Description"(예 "Core: Fix ...", "Spark: Add ...")
  pr_draft_first: false                  # Iceberg는 draft 강제 아님. 작고 완성된 PR 권장. 사람이 제출.
  branch_not_default: true               # main 직접 push 금지 — 항상 브랜치
  cla_required: true                     # ASF ICLA(개인)/CCLA(회사). 커미터 승격 등에서 요구. 자세히는 curated_guide §5.
  tests_required: true                   # 코드(동작) 변경엔 테스트 동반(JUnit5 + AssertJ). 미동반 시 미완성 취급. 단, 동작이 안 변하는 단순 오타 수정(change_type.typo_fix — 주석·Javadoc·*.md·비동작 문자열의 철자/표현 교정, dead {@link})은 테스트 불필요. .java 안의 문자열 오타라도 동작이 안 바뀌면 테스트를 끼워넣지 않는다(억지 테스트 금지).
  test_class_prefix: true                # 테스트 클래스명은 Test로 시작(예 TestExample). 메서드엔 test 접두사 금지.
  test_class_package_private: true       # 테스트 클래스/메서드는 상속 필요 외엔 public 생략(package-private).
  awaitility_over_sleep: true            # 시간 의존 테스트는 Thread.sleep 금지 → Awaitility/waitUntilAfter.
  breaking_changes_api: forbidden        # api/ 공개 API 파괴는 거의 불허 — revapi가 빌드실패. deprecation 사이클 필수.
  new_interface_default_method: true     # 새 인터페이스 메서드(api/ 등 공개)는 반드시 default 구현 포함.
  deprecation_cycle: true                # 폐기는 @Deprecated + @deprecated javadoc(제거 버전·대체 사용법). api/=메이저 1주기, common/core/data=마이너 1주기.
  null_over_optional: true               # 없는 값은 null. Optional 사용 안 함.
  closeable_iterable_over_stream: true   # Stream 대신 CloseableIterable. 항상 close.
  no_jackson_annotations: true           # 직렬화에 Jackson 애너테이션 금지 → 커스텀 XxxParser.toJson/fromJson. JSON 키 kebab-case, 선택 필드는 있을 때만 기록.
  package_private_default: true          # 기본 package-private. public 승격은 입증된 필요가 있을 때만(Ask first).
  google_java_style: true                # Google Java Style(2-space). spotlessApply가 강제. 인라인 FQCN 금지, 항상 import.
  apache_license_header: true            # 모든 신규 파일에 Apache License 헤더(spotless licenseHeaderFile 강제).
  ai_disclosure_required: false          # PR/이슈 본문에 AI Disclosure 블록을 넣지 않는다(사용자 결정). 커밋의 Generated-by: <tool> 토큰은 유지.
  small_focused_pr: true                 # 한 PR = 한 주제. 무관한 공백·import·포맷 변경 분리. 첫 버전은 최소.
  public_api_24h_wait: true              # 공개 API 추가는 커미터가 머지 전 24h 대기(추가 피드백). reviewer가 인지·명시.
  new_dependencies: avoid                # 새 서드파티 의존성은 Ask first(라이선스 호환). Guava 확장 대신 JDK 우선.
  license: Apache-2.0                    # Apache-2.0. 신규 파일 라이선스 헤더 필수.

# spec/거버넌스 게이트(OTel spec_gate의 Iceberg판) — format·REST 스펙은 PMC 투표 영역이라 자동 기여 범위 밖.
# 사용자 결정: format/·open-api/rest-catalog* 변경만 게이팅(PMC 투표 필요), 그 외 일반 PR.
spec_gate:
  # 아래 유형의 후보는 NO-GO/CAUTION(PMC 투표·improvement proposal 선행 안내):
  gated:
    - format-spec-change          # format/ 디렉터리 변경 = Iceberg 테이블 스펙(PMC 투표 찬성 3표, lazy consensus 없음)
    - rest-openapi-spec-change    # open-api/rest-catalog* 변경 = REST 카탈로그 스펙(동일 PMC 투표)
  # 아래는 게이트 면제(자유 진행):
  exempt:
    - bug-fix             # 스펙/문서/형제구현 대비 명백한 결함 수정
    - internal            # 내부 구현/테스트/빌드 내부 변경
    - docs                # Javadoc·문서·dead-ref·broken {@link}
    - parity              # 형제 구현(엔진·파일포맷·카탈로그) 정합 맞춤
  # PMC 투표가 필요한 경로(reviewer가 gated로 판정하는 기준):
  pmc_vote_paths:
    - format/
    - open-api/rest-catalog
  # 스펙/제안 인용 시 권위 출처:
  proposal_ref: https://iceberg.apache.org/contribute/   # Iceberg improvement proposal·스펙 투표 절차

pipeline:
  # 기본은 1실행=1기여(머지 확률 > 양). 단, 같은 스코프에서 strong_candidate 기준을
  # 동시에 충족하는 후보가 2개 이상이면 하나만 고르지 않고 모두 구현한다(아래 strong_candidate).
  max_contributions_per_run: 1    # 기본 1. strong 후보가 여럿이면 strong_candidate.complete_all로 상향.
  score_threshold: 18             # 25점 만점 중 18점 미만 추천 금지
  run_folder_format: yyyyMMddHHmmss   # output/<yyyyMMddHHmmss>/{candidates[,issues],prs}
  series_probe_first: true        # 동일 패턴: 1건 제출 → 머지 확인 후 확산
  # Iceberg 머지 정책: 대부분 PR은 작성자 외 커미터 1명 승인으로 머지. 공개 API 추가는 24h 대기.
  review_model: single-committer-approval   # reviewer가 "커미터 1명이 바로 승인할 명료함"을 기준으로 평가
  # "유력한 후보"(strong candidate) 정의 — 아래 두 조건을 모두 충족할 때.
  # 이 둘을 만족하면 "머지 가능성 높음"(커미터 1명 즉시 승인 명료성)으로 본다.
  strong_candidate:
    verdict: GO                   # P2 candidate-reviewer 판정이 GO여야 함(CAUTION/NO-GO는 strong 아님)
    min_score: 22                 # 25점 척도 22점 이상
    complete_all: true            # strong 후보가 2개 이상이면 전부 P3~P4 구현(worktree/브랜치 분리, 순차 커밋)
  # strong 기준(GO·≥22)을 일부만 충족하는 후보(임계 ≥18은 넘지만 strong은 아님)가 남으면,
  # 파이프라인 종료 시(P5) 사용자에게 그 후보와 미충족 기준을 리마인드한다.
  remind_when_unmet: true

# 산출물 정책 — OSS 기여에 "꼭 필요한" md만 생성한다(불필요 파일/폴더 생성 금지).
# 분기 기준은 change_type(아래): 단순 오타 수정만 PR-only, 그 외 모든 후보는 이슈 초안을 PR보다 먼저 만든다.
output_policy:
  candidate_file: always          # 내부 분석·감사·중복방지(P1 grep) 입력 — 항상 생성
  pr_draft: always                # 실제 제출 artifact — 항상 생성
  issue_draft: required-unless-typo  # 단순 오타 수정이 아니면 항상 작성. 폴더도 그때만 mkdir.
  issue_before_pr: true           # 이슈 초안을 PR 초안보다 "먼저" 작성한다(요구사항).
  issue_required_when:
    - not-typo-fix                # 단순 오타 수정(change_type.typo_fix)이 아닌 모든 후보(버그픽스·parity·internal·신기능 등)
    - no-existing-issue           # gh로 동일 주제 open 이슈가 없음을 확인했을 때만 신규 초안
  # 단순 오타 수정(change_type.typo_fix)은 PR-only(이슈·테스트 생략).
  # 동일 주제 open 이슈가 이미 있으면 새로 만들지 않고 PR 본문에서 참조만(Closes #N 또는 본문 링크).

# 변경 유형 분류 — 산출물(이슈)·테스트 정책의 단일 분기 기준. finder가 태깅 → reviewer가 확인 → contributor가 분기.
change_type:
  # 단순 오타 수정: 의미·동작은 그대로 두고 철자·표현만 고치는 변경.
  # 대상: 주석·Javadoc·*.md 문서·비동작 문자열(로그/예외 메시지 표현)의 철자·표현 교정.
  # 런타임 동작(분기·계산·반환값·출력 계약)이 바뀌면 typo-fix가 아니다(그건 wrong-output 등 비-오타).
  # 정책: 테스트 추가 금지(억지 테스트 금지), 이슈 초안 생략 → PR-only.
  typo_fix:
    no_test: true                 # 검증할 동작이 없다 — 오타 수정 PR에 테스트 클래스를 끼워넣지 않는다.
    pr_only: true                 # 이슈 초안을 만들지 않는다.
  # 그 외 전부 비-오타(non-typo): 동작/구조/계약 변경. 이슈 초안을 PR보다 먼저 작성(output_policy 참조).

# 후보 품질 선호 — NPE/null-guard 단일 패턴 과편향(monoculture) 교정.
# 선행 파이프라인이 거의 매번 "null-guard"로 수렴한 실패를 답습하지 않기 위함:
# GO는 잘 받지만 트리거가 비정상 입력 의존이라 영향이 약하고 방어 노이즈로 비친다.
candidate_quality:
  npe_guard_is_fallback: true          # null/blank 입력 가드 "단독" 후보는 차선책(fallback)으로만
  # 먼저 소진할 고가치 후보 클래스 — 이쪽이 임계를 넘기면 NPE-guard보다 우선 선택.
  prefer_classes:
    - wrong-output     # 정상 입력에 잘못된 결과: 인자 스왑, off-by-one, 잘못된 partition/schema/metric 구성
    - logic-error      # 분기/계산 오류, 무한루프, 리소스 누수(미close된 CloseableIterable), 동시성 결함
    - github-backed    # 재현되는 open issue(특히 good first issue) 또는 머지 PR의 incomplete-fix
    - dead-ref-docs    # 복붙 시 컴파일 에러·dead-link·broken {@link}·잘못된 Javadoc
    - api-contract     # Javadoc/스펙과 실제 동작 불일치, 형제 구현(엔진·파일포맷·카탈로그) parity 갭
  # NPE-guard 후보를 "최종 선택"하려면 finder가 아래 둘을 후보 파일에 명시 입증해야 한다.
  npe_guard_requires:
    - realistic-trigger  # null/blank가 악성·테스트 입력이 아닌 정상 호출경로에서 도달함을 코드로 증명
    - exhausted-higher   # 같은 스코프에서 prefer_classes를 실제 탐색했고 없었음을 한 줄로 기록

# 이슈/PR 초안 분량 가드 — 장황함 방지. Iceberg PR은 짧고 집중적이다.
doc_limits:
  issue_max_words: 200    # 본문 단어수 상한 (끝의 gh 제출 코드블록 제외)
  pr_max_words: 200       # 본문 단어수 상한 (제출/staleness 코드블록 제외)
  rules:
    - one-fact-per-line     # 한 줄 = 한 사실. 같은 사실을 여러 섹션에 반복 금지.
    - no-template-hints     # 템플릿의 <!-- 안내 --> 주석은 최종본에서 삭제.
    - single-code-snippet   # 코드블록은 핵심(수정 형태) 1개만. before/after 중복 금지.
    - factual-imperative    # 마케팅·완충·중언부언 금지. 사실·명령형으로.
    - link-issue-or-pr      # 관련 이슈/머지 PR/형제 코드 링크를 본문에 1줄(있으면)
  self_check: "작성 후 wc -w로 본문 단어수 측정 → 예산 초과 시 중복 사실부터 제거하고 재측정"

# closed-loop 학습 — P0에서 자동 상태 폴링에 사용.
feedback:
  poll_pending_on_setup: true   # P0가 _learnings.md "제출 추적"의 pending PR을 gh로 조회해 결과 반영
  poll_command: 'gh pr view {pr} -R apache/iceberg --json state,mergedAt,closedAt,reviewDecision'

# 고감도 영역: candidate-reviewer가 CAUTION 이상으로 취급 (공개 API 표면·revapi 강제·스펙·코어).
sensitive_areas:
  - api/                       # 공개 인터페이스 표면(revapi 강제, breaking 거의 불허) — AGENTS.md 최강 안정성
  - core/src/main/java/org/apache/iceberg/TableMetadata.java   # 모든 엔진·카탈로그에 파급. Builder 사용 필수.
  - core/src/main/java/org/apache/iceberg/SnapshotProducer.java     # 커밋 경로
  - core/src/main/java/org/apache/iceberg/MergingSnapshotProducer.java  # 커밋 경로
  - core/src/main/java/org/apache/iceberg/ManifestGroup.java   # 컨테이너 재사용 — 병렬 코드 버그 주의
  - core/                      # 테이블 스펙 구현(revapi published). 엔진 비종속이어야 함.
  - format/                    # 테이블 스펙 문서 — PMC 투표 영역(spec_gate gated)
  - open-api/                  # REST 카탈로그 스펙 — PMC 투표 영역(spec_gate gated)
  - parquet/                   # 파일포맷(revapi published)
  - orc/                       # 파일포맷(revapi published)
  - common/                    # 공유 유틸(revapi published)
  - data/                      # 제네릭 데이터 레이어(revapi published) — 엔진 비종속
  - build.gradle               # 루트 빌드 설정
  - settings.gradle            # 모듈 등록
  - baseline.gradle            # spotless/checkstyle/error-prone 설정
  - gradle/libs.versions.toml  # 버전 카탈로그(의존성 버전)
  - versions.props             # 의존성 버전(AGENTS.md: 명시 논의 없이 수정 금지)
  - .baseline/                 # checkstyle/copyright/스타일 설정
  - .asf.yaml                  # ASF 저장소 설정(수정 금지)
  - LICENSE                    # (수정 금지)
  - NOTICE                     # (수정 금지)

# ============================================================================
# 최상위 프로퍼티 가이드 — 발표 질문(z_ebson/deck/questions.md)과의 연결
# ============================================================================
# 이 파일 자체가 Q6 "config schema는 어떻게 생겼나"의 답이다. 최상위 키 12개가 트리를 이루며,
# 발표 답변들은 이 키들의 줄 번호를 근거로 인용한다. (이 가이드는 줄 번호를 밀지 않으려고 파일 끝에 둔다.)
# 각 키가 어느 질문에 답하는 칸인지 한 줄 이상 적어 둔다.
#
# - project: 기여 대상 저장소 좌표(upstream/fork/기본 브랜치/JDK 버전). 다른 저장소로 옮길 때
#     가장 먼저 통째로 갈아끼우는 [REPO-SPECIFIC] 값이라 Q6·Q7(다른 빌드·구조 적용)의 출발점이다.
# - paths: 저장소·파이프라인마다 별도 output·메모리 트리를 두는 칸 → Q2가 말한 "저장소별 분리"가
#     여기서 일어난다. learnings_file 한 줄이 closed-loop 메모리(_learnings.md) 위치를 가리킨다.
# - build: 빌드·테스트·포맷·revapi 커맨드. Gradle→Maven처럼 빌드 방식이 갈려도 이 블록만 바꾸면
#     되느냐가 Q7의 핵심이고, verify·revapi가 Q5의 "validate가 제출 전 실제 재실행하는" 게이트다.
# - conventions: 코딩·리뷰 규칙(테스트 동반·Jackson 금지·CLA·AI disclosure). Q4(사람이 책임지는
#     영역=cla_required)와 Q5(tests_required=수용기준 1개당 테스트 1개)의 근거가 여기 있다.
# - spec_gate: PMC 투표 영역(format/·open-api/rest-catalog*)을 자동 기여에서 제외 → Q4가 짚은
#     "코드 품질이 아니라 거버넌스라서 사람에게 남는 영역"을 config로 표현한 칸이다.
# - pipeline: 후보 우선순위·점수 임계·strong 기준·probe-first. Q2의 "우선순위"와 Q9의 채점 임계가
#     여기 산다(score_threshold 18=추천 임계, strong은 GO·min_score 22).
# - output_policy: 어떤 산출물(candidate/issue/pr)을 언제 만드는지. 1건=1주제(small_focused_pr)와
#     함께 Q3-2의 "사람이 산출물 전체가 아니라 건당 제출 여부만 검토"를 가능하게 한다.
# - change_type: 단순 오타 수정 vs 그 외를 가르는 단일 분기 기준. 테스트·이슈 생성 여부를 정해
#     Q5의 "동작이 안 바뀌면 억지 테스트를 넣지 않는다"와 직접 연결된다.
# - candidate_quality: NPE-guard 단일 패턴 과편향(monoculture) 교정(prefer_classes 먼저 소진).
#     Q2의 우선순위이자, Q3-1에서 메모리 §2 신호가 후보 선호를 보정한 사례의 정책 근거다.
#     Q9의 finder 25점 척도에서 "영향(5)" 점수가 이 정책으로 NPE 후보를 ≤2로 깎는다.
# - doc_limits: 본문 200단어 상한 + wc -w 자동 측정. Q3-2의 "검토 비용을 건당으로 묶는" 자동 가드다.
# - feedback: P0가 §0 pending PR을 gh로 조회해 결과를 메모리에 반영(closed-loop). Q1·Q2가 말한
#     "졸업"(pending→§2 캘리브레이션)을 켜는 스위치다. 만료(TTL)는 없다 — Q2가 인정한 한계.
# - sensitive_areas: reviewer가 CAUTION 이상으로 다루는 고감도 경로. Q8에서 카카오VX 이식 시
#     결제·인증·PII 경로로 재정의하라고 짚은 바로 그 블록이고, Q9 finder "리스크 낮음(5)" 채점의 기준이다.
# ============================================================================
